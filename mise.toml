[tools]
gradle = "latest"

[tasks.download-google-fonts-json]
run = """
if [ -z "${GOOGLE_DEVELOPER_API_KEY:-}" ]; then
  echo "GOOGLE_DEVELOPER_API_KEY is not set"
  exit 1
fi

BASE_URL="https://www.googleapis.com/webfonts/v1/webfonts?key=${GOOGLE_DEVELOPER_API_KEY}"

if [ -n "${GOOGLE_DEVELOPER_API_REFERER:-}" ]; then
  curl -fsS -H "Referer: ${GOOGLE_DEVELOPER_API_REFERER}" "${BASE_URL}" \
    -o webfonts.static.json
  curl -fsS -H "Referer: ${GOOGLE_DEVELOPER_API_REFERER}" "${BASE_URL}&capability=VF" \
    -o webfonts.vf.json
else
  curl -fsS "${BASE_URL}" \
    -o webfonts.static.json
  curl -fsS "${BASE_URL}&capability=VF" \
    -o webfonts.vf.json
fi

python3 scripts/merge_webfonts_json.py \
  --static webfonts.static.json \
  --vf webfonts.vf.json \
  --out webfonts.json

rm -f webfonts.static.json webfonts.vf.json
"""
